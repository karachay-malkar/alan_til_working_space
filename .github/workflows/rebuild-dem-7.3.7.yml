name: Build Alan Map 7.3.7 Z11 volume restoration

on:
  push:
    branches: [7.3.7]
    paths:
      - 'tools/build_dem_unified_7_3_7.py'
      - 'tools/release_7_3_7.py'
      - '.github/workflows/rebuild-dem-7.3.7.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alan-map-7-3-7-z11-volume
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout 7.3.7
        uses: actions/checkout@v4
        with:
          ref: 7.3.7
          fetch-depth: 1

      - name: Publish run handle
        shell: bash
        run: |
          set -euo pipefail
          cat > data/release-run-7.3.7.json <<EOF
          {"version":"7.3.7","status":"building","runId":${{ github.run_id }},"runAttempt":${{ github.run_attempt }},"sourceSha":"${{ github.sha }}"}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/release-run-7.3.7.json
          git commit -m "Start 7.3.7 release build [skip ci]"
          git pull --rebase origin 7.3.7
          git push origin HEAD:7.3.7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Install DEM, PMTiles and validation tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y gdal-bin sqlite3 zip
          python -m pip install --upgrade pip
          python -m pip install rasterio pillow numpy shapely scipy pmtiles
          go install github.com/protomaps/go-pmtiles@v1.30.1
          GO_BIN="$(go env GOPATH)/bin"
          ln -sf "$GO_BIN/go-pmtiles" "$GO_BIN/pmtiles"
          echo "$GO_BIN" >> "$GITHUB_PATH"
          pmtiles version

      - name: Validate 7.3.6 base and prepare unchanged geography
        run: |
          set -euxo pipefail
          mkdir -p build
          python tools/release_7_3_7.py prepare | tee build/release-7.3.7-prepare.json
          python - <<'PY'
          import json
          expected_bounds=[40.51784,42.734095,44.184003,44.534975]
          expected_ring=[[40.51784,43.41265],[43.731622,42.734095],[44.184003,43.85642],[40.970221,44.534975],[40.51784,43.41265]]
          bounds=json.load(open('build/rectangular-bounds.json'))['bounds']
          ring=json.load(open('build/map-frame.geojson'))['features'][0]['geometry']['coordinates'][0]
          if bounds != expected_bounds or ring != expected_ring:
              raise SystemExit(f'7.3.7 geography drifted: bounds={bounds} ring={ring}')
          PY
          find data -maxdepth 1 -type f -name '*.pmtiles' ! -name 'alan-dem-7.3.6.pmtiles' -print0 | sort -z | xargs -0 sha256sum > build/non-dem-pmtiles-before.sha256

      - name: Download Copernicus DEM GLO-30 numeric source COGs
        run: |
          set -euxo pipefail
          mkdir -p build/copernicus-dem
          python - <<'PY'
          import json, math, pathlib, urllib.request
          west,south,east,north=json.load(open('build/rectangular-bounds.json'))['bounds']
          out=pathlib.Path('build/copernicus-dem')
          for lat in range(math.floor(south),math.ceil(north)):
              for lon in range(math.floor(west),math.ceil(east)):
                  ns='N' if lat >= 0 else 'S'
                  ew='E' if lon >= 0 else 'W'
                  tile=f'Copernicus_DSM_COG_10_{ns}{abs(lat):02d}_00_{ew}{abs(lon):03d}_00_DEM'
                  url=f'https://copernicus-dem-30m.s3.eu-central-1.amazonaws.com/{tile}/{tile}.tif'
                  target=out/f'{tile}.tif'
                  request=urllib.request.Request(url,headers={'User-Agent':'AlanMap/7.3.7'})
                  print('download',url)
                  with urllib.request.urlopen(request,timeout=240) as response,target.open('wb') as handle:
                      while True:
                          chunk=response.read(1024*1024)
                          if not chunk:
                              break
                          handle.write(chunk)
          PY

      - name: Warp source through unchanged map frame
        run: |
          set -euxo pipefail
          read WEST SOUTH EAST NORTH < <(python - <<'PY'
          import json
          print(*json.load(open('build/rectangular-bounds.json'))['bounds'])
          PY
          )
          gdalbuildvrt build/copernicus-dem.vrt build/copernicus-dem/*.tif
          gdalwarp -overwrite \
            -t_srs EPSG:4326 \
            -te "$WEST" "$SOUTH" "$EAST" "$NORTH" \
            -cutline build/map-frame.geojson -crop_to_cutline \
            -dstnodata -10000 -r bilinear \
            -of GTiff -co TILED=YES -co COMPRESS=DEFLATE -co BIGTIFF=IF_SAFER \
            build/copernicus-dem.vrt build/copernicus-dem-7.3.7-cutline.tif

      - name: Build sequential Z11 Z10 Z9 Z8 Z7 DEM
        run: |
          set -euxo pipefail
          python tools/build_dem_unified_7_3_7.py \
            --build-from-dem build/copernicus-dem-7.3.7-cutline.tif \
            --output build/alan-dem-7.3.7-clean.mbtiles \
            --frame build/map-frame.geojson \
            | tee build/dem-build-report-7.3.7.json
          python tools/build_dem_unified_7_3_7.py \
            build/alan-dem-7.3.7-clean.mbtiles \
            --frame build/map-frame.geojson --validate \
            | tee build/dem-validation-7.3.7.json
          pmtiles convert build/alan-dem-7.3.7-clean.mbtiles build/alan-dem-7.3.7-clean.pmtiles
          pmtiles verify build/alan-dem-7.3.7-clean.pmtiles

      - name: Preserve hidden DEM edge collar
        run: |
          set -euxo pipefail
          python tools/patch_dem_edge_collar.py \
            build/alan-dem-7.3.7-clean.pmtiles \
            build/alan-dem-7.3.7.pmtiles \
            --data-part build/map-data-7.3.7-dem-config.js \
            --collar-m 4500 \
            --safe-max-elevation-m 1000 \
            --cap-softness-m 120 \
            --inner-taper-m 900 \
            --outer-skirt-m 3200 \
            --technical-base-m -10000 \
            --relief-exaggeration 2.8 \
            --frame-top-m 4000 \
            --report build/dem-edge-collar-report-7.3.7.json
          pmtiles verify build/alan-dem-7.3.7.pmtiles

      - name: Prove DEM archive contract
        run: |
          set -euxo pipefail
          python - <<'PY'
          import io, json
          from PIL import Image
          from pmtiles.reader import MmapSource, Reader, all_tiles
          path='build/alan-dem-7.3.7.pmtiles'
          with open(path,'rb') as handle:
              source=MmapSource(handle)
              reader=Reader(source)
              records=list(all_tiles(source))
          zooms=sorted({int(z) for (z,x,y),payload in records})
          if zooms != [7,8,9,10,11]:
              raise SystemExit(f'Unexpected physical zooms: {zooms}')
          for (z,x,y),payload in records:
              image=Image.open(io.BytesIO(payload))
              if image.size != (256,256):
                  raise SystemExit(f'Non-256 tile z{z}/{x}/{y}: {image.size}')
          proof={'version':'7.3.7','physicalNativeZooms':zooms,'tileSize':256,'highestNativeZoom':11,'noNativeTilesAfterZ11':True,'tileCount':len(records)}
          open('build/dem-archive-proof-7.3.7.json','w').write(json.dumps(proof,indent=2)+'\n')
          print(json.dumps(proof,indent=2))
          PY

      - name: Integrate 7.3.7 runtime architecture
        run: |
          set -euxo pipefail
          python tools/release_7_3_7.py finalize \
            --dem build/alan-dem-7.3.7.pmtiles \
            --build-report build/dem-build-report-7.3.7.json \
            --validation-report build/dem-validation-7.3.7.json \
            --collar-report build/dem-edge-collar-report-7.3.7.json \
            | tee build/release-7.3.7.json
          python tools/release_7_3_7.py validate
          node --check assets/bootstrap.js
          node --check assets/map-page.js
          node --check assets/map-ui.js
          node --check tests/runtime-contract.mjs
          node --check tests/map-smoke.mjs
          node --check tests/terrain-architecture-7.3.7.mjs
          python -m py_compile tools/build_dem_unified_7_3_7.py tools/release_7_3_7.py
          node tests/runtime-contract.mjs
          node tests/terrain-architecture-7.3.7.mjs

      - name: Verify unchanged non-DEM map archives
        run: |
          set -euxo pipefail
          find data -maxdepth 1 -type f -name '*.pmtiles' ! -name 'alan-dem-7.3.6.pmtiles' ! -name 'alan-dem-7.3.7.pmtiles' -print0 | sort -z | xargs -0 sha256sum > build/non-dem-pmtiles-after.sha256
          diff -u build/non-dem-pmtiles-before.sha256 build/non-dem-pmtiles-after.sha256

      - name: Harden terrain elevation readiness probe
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('tests/map-smoke.mjs')
          text=path.read_text(encoding='utf-8')
          old="  await page.waitForFunction(() => window.ALAN_MAP_INSTANCE?.map?.isSourceLoaded?.('terrain-dem') === true,undefined,{timeout:60000});\n"
          new="""  await page.waitForFunction(() => {\n    const map=window.ALAN_MAP_INSTANCE?.map;\n    if (!map?.queryTerrainElevation) return false;\n    const element=map.getContainer();\n    let finite=0;\n    for (const fx of [.35,.5,.65]) for (const fy of [.35,.5,.65]) {\n      const lngLat=map.unproject([element.clientWidth*fx,element.clientHeight*fy]);\n      if (Number.isFinite(map.queryTerrainElevation(lngLat))) finite += 1;\n    }\n    return finite >= 5;\n  },undefined,{timeout:60000,polling:250});\n"""
          if old not in text:
              raise SystemExit('terrain source-loaded wait marker missing')
          text=text.replace(old,new,1)
          old_probe="  const terrainProbe=await page.evaluate(()=>{const map=window.ALAN_MAP_INSTANCE.map;const samples=[];const c=[42.445874,43.349602];for(const dx of [-.055,-.0275,0,.0275,.055])for(const dy of [-.045,-.0225,0,.0225,.045]){const e=map.queryTerrainElevation?.([c[0]+dx,c[1]+dy]);if(Number.isFinite(e))samples.push(e);}return{terrain:map.getTerrain?.(),pitch:map.getPitch(),zoom:map.getZoom(),finiteSamples:samples.length,reliefRange:samples.length?Math.max(...samples)-Math.min(...samples):null};});\n"
          new_probe="  const terrainProbe=await page.evaluate(()=>{const map=window.ALAN_MAP_INSTANCE.map;const element=map.getContainer();const samples=[];for(const fx of [.25,.375,.5,.625,.75])for(const fy of [.30,.40,.50,.60,.70]){const lngLat=map.unproject([element.clientWidth*fx,element.clientHeight*fy]);const e=map.queryTerrainElevation?.(lngLat);if(Number.isFinite(e))samples.push(e);}return{terrain:map.getTerrain?.(),pitch:map.getPitch(),zoom:map.getZoom(),finiteSamples:samples.length,reliefRange:samples.length?Math.max(...samples)-Math.min(...samples):null};});\n"
          if old_probe not in text:
              raise SystemExit('terrain geographic probe marker missing')
          path.write_text(text.replace(old_probe,new_probe,1),encoding='utf-8')
          PY
          node --check tests/map-smoke.mjs

      - name: Browser smoke test
        run: |
          set -euxo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          node tests/map-smoke.mjs

      - name: Remove obsolete 7.3.6 DEM
        run: |
          set -euxo pipefail
          git rm -- data/alan-dem-7.3.6.pmtiles
          rm -rf node_modules package-lock.json

      - name: Commit complete 7.3.7 release
        run: |
          set -euxo pipefail
          cat > data/release-run-7.3.7.json <<EOF
          {"version":"7.3.7","status":"validated","runId":${{ github.run_id }},"runAttempt":${{ github.run_attempt }},"sourceSha":"${{ github.sha }}"}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m 'Release Z11 volume restoration 7.3.7 [skip ci]'
          git pull --rebase origin 7.3.7
          git push origin HEAD:7.3.7

      - name: Package complete project and exact file sizes
        run: |
          set -euxo pipefail
          rm -rf /tmp/alan-map-7.3.7
          mkdir -p /tmp/alan-map-7.3.7
          rsync -a --exclude='.git' --exclude='build' --exclude='node_modules' ./ /tmp/alan-map-7.3.7/
          cd /tmp
          find alan-map-7.3.7 -type f -printf '%P\t%s bytes\n' | sort > alan-map-7.3.7-file-sizes.txt
          zip -qr alan-map-7.3.7.zip alan-map-7.3.7
          sha256sum alan-map-7.3.7.zip > alan-map-7.3.7.zip.sha256
          ls -lh alan-map-7.3.7.zip
          cat alan-map-7.3.7.zip.sha256

      - name: Upload complete 7.3.7 archive
        uses: actions/upload-artifact@v4
        with:
          name: alan-map-7.3.7-complete
          path: |
            /tmp/alan-map-7.3.7.zip
            /tmp/alan-map-7.3.7-file-sizes.txt
            /tmp/alan-map-7.3.7.zip.sha256
          if-no-files-found: error
          compression-level: 0